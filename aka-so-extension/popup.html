<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKA.SO URL 줄이기</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <main>
    <header><div><span class="brand">AKA.SO</span><h1>긴 링크를 짧게.</h1></div><button id="settings" class="text-button" type="button">설정</button></header>
    <form id="shorten-form">
      <label for="url">줄일 URL</label>
      <textarea id="url" rows="3" placeholder="https://example.com/long-url" required spellcheck="false"></textarea>
      <button id="current-page" class="text-button current" type="button">현재 페이지 URL 가져오기</button>
      <label for="password">링크 비밀번호 (선택)</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="비밀번호 없이 생성하려면 비워 두세요">
      <button id="shorten" class="primary" type="submit" disabled>URL 줄이기</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" class="result" hidden>
      <label for="short-url">단축 URL</label>
      <input id="short-url" type="text" readonly aria-label="생성된 단축 URL">
      <div class="actions"><button id="copy" class="primary" type="button">복사하기</button><a id="open" class="secondary" target="_blank" rel="noopener noreferrer">링크 열기 ↗</a></div>
    </section>
    <footer>버튼을 누르면 입력한 URL을 AKA.SO로 전송합니다.</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
