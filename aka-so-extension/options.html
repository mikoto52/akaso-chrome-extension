<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKA.SO 설정</title><link rel="stylesheet" href="styles.css"></head>
<body class="options">
  <main class="settings-card">
    <span class="brand">AKA.SO</span><h1>API 설정</h1>
    <p class="intro">URL을 줄이는 데 사용할 API 토큰을 저장하세요.</p>
    <form id="settings-form">
      <label for="token">API_TOKEN</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="API 토큰 입력" required>
      <label class="checkbox"><input id="show-token" type="checkbox"> 토큰 표시</label>
      <label for="http-status-code">기본 리디렉션 상태 코드</label>
      <select id="http-status-code">
        <option value="301">301 — 영구 이동</option>
        <option value="302" selected>302 — 임시 이동 (기본값)</option>
        <option value="307">307 — 임시 이동, 요청 메서드 유지</option>
        <option value="308">308 — 영구 이동, 요청 메서드 유지</option>
      </select>
      <div class="actions"><button id="save" class="primary" type="submit" disabled>저장</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">Bearer 접두어 없이 토큰 값만 입력하세요. 토큰은 이 Chrome 프로필에 저장되며 다른 기기와 동기화되지 않습니다. 저장된 값은 별도로 암호화되지 않습니다.</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
